version: 2

updates:
  # Application dependencies. This has to be the `bun` ecosystem, not `npm`:
  # Dependabot split Bun out of npm_and_yarn into its own ecosystem, and the
  # npm one maintains package-lock.json / yarn.lock -- neither of which this
  # repo has. Under `npm` it rewrote package.json and left bun.lock untouched,
  # so every job in every workflow died at `bun install --frozen-lockfile`
  # ("lockfile had changes, but lockfile is frozen") before running a single
  # test. `bun` is generally available, so no enable-beta-ecosystems flag.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
    open-pull-requests-limit: 5
    # Routine version bumps are grouped into one PR per class so they don't
    # crowd out real work. Security updates ignore grouping and always open
    # their own PR.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Next.js and React majors are coordinated upgrades, not drive-by bumps.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Same reasoning for the build chain. These three are declared with wide
      # ranges ("^5", "^9", "^20"), so the first weekly run proposed TypeScript
      # 7, ESLint 10 and @types/node 26 as drive-by bumps. Each is a migration
      # with its own config and lint-rule fallout, so they get done on purpose.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned at 20.11.6 (#1845): from 20.14.6 on (21.0.4 included) elements
      # that should leave the DOM after a tab switch or a dialog closing stay
      # mounted, and MeetingDetailView's tests run out of memory printing them.
      # Drop these once the follow-up finds the cause (#1846). Every version
      # past the pin is ignored, not just >=20.12: a 20.11.x bump of the
      # registrator lets its `^20.11.x` range resolve a nested happy-dom 20.14.x
      # (#1850 did exactly this). The `overrides` entry in package.json holds
      # every copy at the pin; these keep Dependabot from proposing bumps that
      # the override would silently undo.
      - dependency-name: "happy-dom"
        versions: [">20.11.6"]
      - dependency-name: "@happy-dom/global-registrator"
        versions: [">20.11.6"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
